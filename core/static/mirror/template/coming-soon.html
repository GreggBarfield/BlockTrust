<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="keywords" content="HTML5 Template" />
    <meta name="description" content="Technol - Multipurpose HTML5 Template" />
    <meta name="author" content="potenzaglobalsolutions.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Technol - Multipurpose HTML5 Template</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="images/favicon.ico" />

    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Archivo:400,400i,500,500i,600,600i,700,700i&display=swap">

    <!-- CSS Global Compulsory (Do not remove)-->
    <link rel="stylesheet" href="libs/font-awesome/css/all.min.css" />
    <link rel="stylesheet" href="libs/flaticon/css/flaticon.css" />
    <link rel="stylesheet" href="libs/themify/css/themify-icons.min.css" />

    <!-- Template Style -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

<body>

<!--=================================
coming-soon -->
<section class="bg-holder vh-100 text-center py-0">
  <div class="container h-100">
    <div class="row justify-content-center h-100">
      <div class="col-lg-7 col-md-10 align-self-center">
        <h1 class="font-weight-bold mb-1">Coming Soon</h1>
        <p class="mb-3 text-muted">We are currently working on a website and won't take long.</p>
        <div class="countdown">
          <span class="theme-color days">00</span>
          <p class="days_ref">days</p>
        </div>
        <div class="countdown">
          <span class="theme-color hours">00</span>
          <p class="hours_ref">hours</p>
        </div>
        <div class="countdown">
          <span class="theme-color minutes">00</span>
          <p class="minutes_ref">minutes</p>
        </div>
        <div class="countdown mr-0">
          <span class="theme-color seconds">00</span>
          <p class="seconds_ref">seconds</p>
        </div>
        <div class="mt-3">
            <h5 class="mb-2 font-weight-bold">Provide your email address & we will notify you when site is ready:</h5>
            <div class="newsletter position-relative">
              <form>
                <div class="form-group mb-0">
                  <input type="email" class="form-control" placeholder="Enter email">
                  <span class="focus-border"></span>
                </div>
                <button type="submit" class="btn btn-primary position-absolute top-0 right-0 rounded-0">Get Notified</button>
              </form>
            </div>
        </div>
        <div class="login-social-media mt-4">
          <div class="d-block">
            <h5 class="mb-2 font-weight-bold">Follow us on:</h5>
            <a class="btn facebook-bg social-bg-hover mb-2 mb-sm-0" href="#"><span><i class="fab fa-facebook-f pr-1"></i>Facebook</span></a>
            <a class="btn twitter-bg social-bg-hover mb-2 mb-sm-0" href="#"><span><i class="fab fa-twitter pr-1"></i>Twitter</span></a>
            <a class="btn google-bg social-bg-hover mb-2 mb-sm-0" href="#"><span><i class="fab fa-google pr-1"></i>Google</span></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!--=================================
coming-soon -->

Javascript -->

  <!-- JS Global Compulsory (Do not remove)-->
  <script src="libs/jquery/jquery-3.4.1.min.js"></script>
  <script src="libs/popper/popper.min.js"></script>
  <script src="libs/bootstrap/bootstrap.min.js"></script>

  <!-- Page JS Implementing Plugins (Remove the plugin script here if site does not use that feature)-->
  <script src="libs/appear/jquery.appear.js"></script>
  <script src="libs/countdown/jquery.downCount.js"></script>

  <!-- Template Scripts (Do not remove)-->
  <script src="js/custom.js"></script>

</body>

</html>
