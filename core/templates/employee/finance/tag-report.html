{% extends "employee/standard.html" %}

{% set page_title = "Tag Report" %}
{% block employee_content %}

<div class="row">
    <div class="col-md">
        <div class="card">
            <div class="card-header">
                <h5>Tag Report</h5>
                <a class="btn btn-outline-primary float-right"><i class="fa fa-download"></i>Download</a>
            </div>
            <div class="card-body mb-2">
                <div class="col-lg-12 mt-5">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ACCOUNT NUMBER</th>
                                <th>COMPANY</th>
                                <th>TAG COUNT</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for item in accounts_and_tags %}
                            <tr>
                                <th>{{item.id}}</th>
                                <th>{{item.company}}</th>
                                <th>{{item.tag_count}}</th>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    let accountsAndTags = JSON.parse('{{ accounts_and_tags|tojson }}');
    let headers = ["ACCOUNT NUMBER", "COMPANY", "TAG COUNT"];
    let tableExport = [headers];
    for(const item of accountsAndTags){
        tableExport.push([
            item.id, 
            item.company,
            item.tag_count,
        ]);
    }

    let csvContent =  tableExport.map(e => e.join(",")).join("\n");
    let encoded = encodeURIComponent(csvContent);
    let downloadButton = document.getElementsByClassName("btn-outline-primary")[0];
    downloadButton.setAttribute("href", "data:text/csv;charset=utf-8," + encoded);
    downloadButton.setAttribute("download", "TagReport.csv");
    downloadButton.classList.remove("d-none")

    document.addEventListener('DOMContentLoaded', function () {
        $('.table').DataTable({pageLength:50});
    });
</script>
{% endblock employee_content %}
