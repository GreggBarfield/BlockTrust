{% extends "dashboard/standard.html" %}

{% set page_title = "Tag Store" %}
{% set dashboard_locations = [("/dashboard/tag-store", "Tag Store")] %}
{% block dashboard_content_header %}
Tag Store
{% endblock dashboard_content_header %}

{% block dashboard_content %}

<div class="col-md-12 d-flex justify-content-end m-2 pr-4">
    <button class="btn btn-outline-primary rectangle m-1">
        VIEW CART&nbsp;<i class="fas fa-shopping-cart"></i>
    </button>
</div>
<div class="row">
    <div class="col">
        <div 
            class = "col-sm-12 mb-0 widget" 
            data-widget-type = "tag store"
            data-widget-all-product-data = '{{all_product_data|tojson}}'
            data-widget-product-categories = '{{product_categories|tojson}}'
            data-widget-product-vendor-ids-to-names = '{{product_vendor_ids_to_names|tojson}}'
        >
        </div>
    </div>
</div>
{% endblock dashboard_content %}
