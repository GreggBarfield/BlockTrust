{% extends "outside/shop-iframe/shop-standard.html" %}

{% set page_title = "Shopping Cart" | string %} 

{% block outside_content %}
<section style="background-color: white;">
                <div class="container"> 
                    <table class="shopping-cart" id="shopping-cart">
                        <thead>
                            <tr>
                                <th>PRODUCT</th>
                                <th>QUANTITY</th>
                                <th>PRICE PER UNIT</th>
                                <th>TOTAL</th>
                                <th>&nbsp;</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>    
                </div><!-- / container -->
                <section id="cart-features" class="bg-white">
                    <div class="container">
                        <div class="row cart-footer">
                            <div class="coupon col-md-6 mt-1 mb-1">
                                <div class="input-group">
                                    <input type="text" class="form-control form-control-sm" id="coupon-code" placeholder="Coupon Code">
                                    <span class="input-group-btn">
                                    <button class="btn btn-primary ml-3" type="button"><span>APPLY COUPON</span></button>
                                    </span>
                                </div>
                            </div><!-- / input-group -->
                            <div class="update-cart col-md-6 mt-1 mb-1">
                                <a href="/external/shop" class="btn btn-primary" ><span>CONTINUE SHOPPING</span></a>
                            </div><!-- / update-cart -->
                            <div class="col-md-6 cart-total">
                                <h4 class="pb-3">CART TOTAL</h4>
                                <div class="row">
                                    <div class="col-md-3 sub-col-left">
                                        <p>Subtotal: </p>
                                        <p>Shipping: </p>
                                        <p>Tax: </p>
                                        <p>Total: </p>
                                        
                                    </div>
                                    <div class="col-md-3 sub-col-right">
                                        <p><span class="text-primary">$</span><span class="text-primary" id="subtotal"></span></p>
                                        <p><span class="text-primary">$</span><span class="text-primary" id="shipping"></span></p>
                                        <p><span class="text-primary">$</span><span class="text-primary" id="tax"></span></p>
                                        <p><span class="text-primary">$</span><span class="text-primary" id="grandTotal"></span></p>
                                    </div>
                                </div><!-- / row -->
                            </div><!-- / cart-total -->
                            <div class="col-md-6 cart-checkout">
                                <button class="btn btn-primary mt-1 mb-1" id="proceedButton">PROCEED TO CHECKOUT</button>
                            </div><!-- / cart-checkout -->
                        </div>
                    </div><!-- / container -->
                </section><!-- / cart-features -->
</section>
<script type="module" src="/static/entry_points/shop_iframe/shopping_cart.mjs"></script>
{% endblock outside_content %}
