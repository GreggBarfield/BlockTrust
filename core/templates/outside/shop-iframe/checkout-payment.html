

{% extends "outside/shop-iframe/shop-standard.html" %}

{% set page_title ="Checkout Payment"| string %}

{% block outside_content %}
<section style="background-color: white;">
    <section id="checkout" class="bg-white">
        <div class="container">
            <div class="row checkout-screen">
                <div class="col-md-9">
                    <h4>PAYMENT DETAILS</h4>
                    <h5 class="text-warning"><strong> You will be charged: $<span id="grand-total-warning-text"></span></strong></h5>
                    <form id="payment-form" method="POST" request_redirect_to="{{ redirect_to }}">
                        <div class="form-row">                        	
                            <div class="form-group col-md-6">                          
                                <label for="name">
                                    Name
                                </label>
                                <input id="name" placeholder="John Doe" value="{{name}}" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="card-element">
                                    Credit Card
                                </label>
                                <div id="card-element">
                                <!-- Elements will create input elements here -->
                                </div>
                            </div>
                            <!-- We'll put the error messages in this element -->                       
                            <div id="card-errors" role="alert"></div>    	
                        </div>               	
                        <button id="submit" class="btn btn-outline-primary rectangle mt-2">Pay</button>
                    </form>
                    <br/>
                    <div id="messages" class="alert alert-danger" style="display: none;"></div> 
                </div>

                <div class="col-md-3 cart-total">
                    <h4 class="pb-3">CART TOTAL</h4>
                    <div class="row">
                        <div class="col sub-col-left">
                            <p>Subtotal: </p>
                            <p>Shipping: </p>
                            <p>Tax: </p>
                            <p>Discount: </p>
                            <p><b>Total:</b> </p>   
                        </div>
                        <div class="col sub-col-right">
                            <p><span class="text-primary">$</span><span class="text-primary" id="subtotal"></span></p>
                            <p><span class="text-primary">$</span><span class="text-primary" id="shipping"></span></p>
                            <p><span class="text-primary">$</span><span class="text-primary" id="tax"></span></p>
                            <p><span class="text-primary">-$</span><span class="text-primary" id="discount"></span></p>
                            <p><b><span class="text-primary">$</span><span class="text-primary" id="grandTotal"></span></b></p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
</section>
<script src="https://js.stripe.com/v3/"></script> 
<script type="text/javascript">
    var partner_id = '{{ partner_id }}'
</script>
<script type="module" src="/static/entry_points/shop_iframe/checkout_payment.mjs"></script>
{% endblock outside_content %}
