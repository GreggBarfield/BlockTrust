{% extends "outside/standard.html" %}

{% set page_title = "Shop"| string %}

    <div class="container">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-light justify-content-center bg-transparent p-0 m-0">
                        <li class="breadcrumb-item">
                            <a href="/">
