{% extends "outside/standard.html" %}

{% set page_title = "Shop| Login" + error_code | string %}

{% block outside_banner %}
<div class="header-inner bg-light text-center bg-overlay-dark-40 py-4 py-md-5" style="background: url(/static/images/bison_luckyb_banner2.jpg); background-size: cover">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-light justify-content-center bg-transparent p-0 m-0">
                        <li class="breadcrumb-item">
                            <a href="/">
                                <i class="fa fa-home pr-1"></i>
                                Login to access Shop
                            </a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page"></li>
                    </ol>
                </nav>
            </div>
        </div>
    </div>
</div>
{% endblock outside_banner %}

{% block outside_content %}
<section style="background-color: white;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 mt-4 mt-sm-0 text-center">
              <div id="notfound">
                <div class="notfound">
                  <div class="notfound-404">
                  </div>
                  <p><h2>Please Login to shop at Blocktrust Network!</h2></p>
                  <a class="btn btn-dark" href="/login">Go To Login</a>
                </div>
              </div>
            </div>
          </div>
    </div>
</section>
{% endblock outside_content %}
