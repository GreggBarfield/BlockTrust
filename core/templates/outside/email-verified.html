{% extends "outside/standard.html" %}

{% set page_title = "Email Verification " + error_code | string %}

{% block outside_banner %}
<div class="header-inner bg-light text-center bg-overlay-dark-40 py-4 py-md-5" style="background: url(/static/images/bison_luckyb_banner2.jpg); background-size: cover">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="text-white">Thank you</h1>
            </div>
        </div>
    </div>
</div>
{% endblock outside_banner %}

{% block outside_content %}
<div class="row justify-content-center">
    <div class="card border-secondary rounded text-center col-md-5 m-3">
        <p><h4>Your email has been verified!</h4></p>
        <p><a class="btn btn-dark w-25" href="/login">Go To Login</a></p>
    </div>
</div>
{% endblock outside_content %}
