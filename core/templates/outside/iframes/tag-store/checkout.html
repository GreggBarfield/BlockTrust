{% extends "outside/iframes/iframe-standard.html" %}

{% set page_title = "Checkout"| string %}

{% block outside_content %}
<div class="row">
    <div class="col">
        <div 
            class = "col-sm-12 mb-0 widget" 
            data-widget-type = "checkout"
            data-widget-first-name = '{{user_first_name}}'
            data-widget-last-name = '{{user_last_name}}'
            data-widget-company-name = '{{user_account.company()}}'
            data-widget-address = '{{user_account.address()}}'
            data-widget-city = '{{user_account.city()}}'
            data-widget-state = '{{user_account.state()}}'
            data-widget-zip = '{{user_account.zip()}}'
            data-widget-phone = '{{user_account.phone()}}'
            data-widget-shop-homepage-link = '{{shop_homepage_link}}'
            data-widget-shopping-cart-link = '{{shopping_cart_link}}'
            data-widget-checkout-payment-link = '{{checkout_payment_link}}' 
        ></div>
    </div>
</div>
{% endblock outside_content %}
