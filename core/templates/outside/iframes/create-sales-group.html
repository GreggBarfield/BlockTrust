{% extends "outside/iframes/iframe-standard.html" %}

{% set page_title = "Create Sales Group"| string %}

{% block outside_content %}
<div class="col-sm-12 widget" data-widget-type="create sales group" data-widget-form-post-route="{{form_post_route}}"></div>
<div class="card m-11 p-1">
    <div class="card-header form-group d-flex justify-content-between">
        <h5>Create New Sales Group</h5>
    </div>
    <div class="card-body">
        <div>
            <form id="create-sales-group-form">

                <h4>Marketing</h4>
                <div class="form-row">
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Sales Group Nickname
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="This is the name for this sales group"></a>
                        </label>
                        <input class="form-control" id="marketing-name" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-2">
                        <label class="form-label">
                            Total Animals
                        </label>
                        <input class="form-control" id="marketing-total-animals" type="number" min="0" required>
                    </div>
                    <div class="form-group d-block col-md-2">
                        <label class="form-label">
                            Marketing Zip Code
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="This is the zip code of location where the cattle will be picked up."></a>
                        </label>
                        <input class="form-control" id="marketing-zip" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Marketing Dates
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="This is the date range for the sale."></a>
                        </label>
                        <div class="d-flex">
                            <input class="form-control col-md-5" id="marketing-start-date" type="date" required>
                            <h6 class="col-md-2">TO</h6>
                            <input class="form-control col-md-5" id="marketing-end-date" type="date" required>
                        </div>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Delivery Location Type
                        </label>
                        <select class="form-control" id="marketing-delivery-location-type"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Auction Market
                        </label>
                        <select class="form-control" id="marketing-auction-market"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Delivery Location
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="This is the place where the cattle will be picked up (example “ABC Auction Market” or “Off Ranch”)"></a>
                        </label>
                        <input class="form-control" id="marketing-delivery-location" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Slide
                        </label>
                        <input class="form-control" id="marketing-slide" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Weighing Conditions
                        </label>
                        <input class="form-control" id="marketing-weighing-conditions" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Represented By
                        </label>
                        <input class="form-control" id="marketing-represented-by" type="text" required>
                    </div>
                </div>

                <h4>Characteristics</h4>
                <div class="form-row">
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Category
                        </label>
                        <select class="form-control" id="characteristics-category"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Breeds
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="Please choose all the breeds of cattle in the group."></a>
                        </label>
                        <select class="form-control" id="characteristics-breeds"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Breed Comments
                        </label>
                        <input class="form-control" id="characteristics-breed-comments" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Base Weight
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="Please enter the average weight of the cattle in the group"></a>
                        </label>
                        <input class="form-control" id="characteristics-base-weight" type="number" min="0" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Weight Variance
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="Please enter the variance of the weight average since it is not exact. (example: “20 lbs”)"></a>
                        </label>
                        <input class="form-control" id="characteristics-weight-variance" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Weighing Conditions
                        </label>
                        <input class="form-control" id="characteristics-weighing-conditions" type="text" required>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Frame
                        </label>
                        <select class="form-control" id="characteristics-frame"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Muscling
                        </label>
                        <select class="form-control" id="characteristics-muscling"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Horns
                        </label>
                        <select class="form-control" id="characteristics-horns"></select>
                    </div>
                </div>
                <h4>Gentics</h4>
                <div class="form-row">
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Do you do genetic or genomic testing?
                        </label>
                        <select class="form-control" id="genetics-genomic-testing"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Do you have the EPD's on the sires of the cattle you're planning to sell?
                        </label>
                        <select class="form-control" id="genetics-epd"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Enter any comment related to genetics.
                        </label>
                        <input class="form-control" id="genetics-comments" type="text" required>
                    </div>
                </div>
                <h4>Maintenance</h4>
                <div class="form-row">
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Precon Program
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="Please enter the pre-conditioning program this group of cattle is on or “not listed”."></a>
                        </label>
                        <select class="form-control" id="maintenance-preconditioning-program"></select>
                    </div>
                    <div class="form-group d-block col-md-2">
                        <label class="form-label">
                            Precon Program
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="Please enter vaccinations given to the cattle in this group or “not listed”."></a>
                        </label>
                        <select class="form-control" id="maintenance-vaccinations"></select>
                    </div>
                    <div class="form-group d-block col-md-2">
                        <label class="form-label">
                            Annual Cattle Herd Vaccinations
                        </label>
                        <select class="form-control" id="maintenance-annual-cattle-herd-vaccinations"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Feeding Program
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="Please enter the feeding program this group of cattle is on or “not listed”."></a>
                        </label>
                        <select class="form-control" id="maintenance-feeding-program"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Implants
                        </label>
                        <select class="form-control" id="maintenance-implants"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            Castrated
                        </label>
                        <select class="form-control" id="maintenance-castrated"></select>
                    </div>
                    <div class="form-group d-block col-md-4">
                        <label class="form-label">
                            PVP Program
                            <a 
                            class="feather icon-info"
                            style="color:#2962FF;padding-left:6px;width:100%; vertical-align:-1px"
                            data-toggle="true"
                            data-placement="right"
                            title="Please enter the Processed Verified  program this group of cattle is on or “not listed”."></a>
                        </label>
                        <select class="form-control" id="maintenance-pvp-program"></select>
                    </div>
                </div>
                <h4>Comments</h4>
                <div class="form-row">
                    <textarea class="form-control max-textarea" id="sales-group-comments" max-length="1000" rows="4"></textarea>
                </div>
                <div class="form-row m-1 p-1 d-flex">
                    <div><input type="checkbox" id="publish"></div>
                    <div class="ml-2"><h5>Publish</h5></div>
                </div>
                <div class="form-row m-1 p-1 d-flex">
                    <div><input type="checkbox" id="show-carcass-data"></div>
                    <div class="ml-2"><h5>Show Carcass Data</h5></div>
                </div>
                <div class="form-group d-block">
                    <button class="btn btn-primary" disabled>Save</button>
                    <p class="d-none mt-2 mb-0" id="status-message"></p>
                    <p class="d-none mt-2 mb-0  alert alert-danger" id="error-message"></p>
                </div>
            </form>
        </div>
    </div>
</div>
<script type="text/javascript">
    var auctionMarkets = JSON.parse('{{auction_markets|tojson}}');
</script>
<script type="module" src="/static/entry_points/outside/iframes/create_sales_group.mjs"></script>
{% endblock outside_content %}
