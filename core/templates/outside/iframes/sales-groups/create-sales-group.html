{% extends "outside/iframes/iframe-standard.html" %}

{% set page_title = "Create Sales Group"| string %}

{% block outside_content %}

<div class="row">
    <div class="col">
        <div 
            class="col-sm-12 widget"
            data-widget-type="create sales group"
            data-widget-form-post-route="{{form_post_route}}"
            data-widget-auction-markets='{{auction_markets|tojson}}'
            data-widget-pre-select-auction-market='{{pre_select_auction_market}}'
            data-widget-pre-selected-auction-market-id='{{pre_selected_auction_market_id}}'
        ></div>
    </div>
</div>
{% endblock outside_content %}
