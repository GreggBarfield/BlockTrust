{% extends "outside/standard.html" %}


{% block outside_banner %}
<section class="header-inner bg-light text-center bg-overlay-dark-40 py-4 py-md-5"
    style="background: url(/static/images/banners/{{ info_banner_image }}); background-size: cover">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-white mb-1">{{ page_title }}</h1>
            </div>
        </div>
    </div>
</section>
{% endblock outside_banner %}

{% block outside_content %}
<section style="background-color: white;">
    <div class="container">
        <div class="row">
            <div class="col-lg-9">
                {% block info_left_col %}
                Info left col not specified
                {% endblock info_left_col %}
            </div>
            <div class="col-lg-3 mb-2">
                <div class="sidebar">

                    <div class="widget widget-categories mb-3">
                        <h5 class="widget-title font-weight-normal mb-2">Contact Us</h5>
                    </div>
                    <div style="border-left:1px solid #c0c0c0;padding:20px">
                        <form id="interactive-contact-us" class="needs-validation" novalidate>
                            <div class="input-group mb-2">
                                <i class="ti-user align-self-center text-primary"></i>
                                <input name="name" type="text" class="form-control"
                                    placeholder="Your Name">
                                <span class="focus-border"></span>
                            </div>

                            <div class="input-group mb-2">
                                <i class="far fa-envelope align-self-center text-primary"></i>
                                <input name="email" type="text" class="form-control"
                                    placeholder="Your E-mail">
                                <span class="focus-border"></span>
                            </div>

                            <div class="input-group mb-2">
                                <i class="ti-pencil fa-flip-horizontal text-primary"></i>
                                <textarea name="message" class="form-control"
                                    rows="4" placeholder="Your Message"></textarea>
                                <span class="focus-border"></span>
                            </div>

                            <button type="submit" class="btn btn-primary">Submit</button>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
{% endblock outside_content %}
