services:
  core:
    environment:
      - PYTHONUNBUFFERED=1
    build:
      context: .
      dockerfile: dockerfile.dev
    ports:
      - "5000:5000"
    volumes:
      - ../:/home/ubuntu/core
  mysql:
    image: mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ../../local/mysql:/var/lib/mysql
  webpack:
    build:
      context: ./webpack
      dockerfile: dockerfile.dev
    volumes:
      - ../:/home/ubuntu/core