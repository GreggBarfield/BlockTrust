services:
  core:
    build:
      context: .
      dockerfile: dockerfile.dev
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - ../:/home/ubuntu/core
  mysql:
    image: mysql
    ports:
      - "0.0.0.0:3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ../../local/mysql:/var/lib/mysql
