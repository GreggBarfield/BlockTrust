services:
  core:
    build:
      context: .
      dockerfile: dockerfile.dev
    env_file: dev.env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ../:/home/ubuntu/core
  mysql:
    image: mysql
    ports:
      - "127.0.0.1:3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ../../local/mysql:/var/lib/mysql
