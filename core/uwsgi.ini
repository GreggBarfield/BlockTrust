[uwsgi]
strict = true
module = core.main:app

master = true
enable-threads = true
processes = 4

socket = :5000
vacuum = true

die-on-term = true
need-app = true
single-interpreter = true
auto-procname = true

max-requests = 2000
max-worker-lifetime = 7200
reload-on-rss = 2048
worker-reload-mercy = 60

