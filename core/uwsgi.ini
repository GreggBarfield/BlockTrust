[uwsgi]
strict = true
module = core.main:app

master = true
processes = 4

socket = :5000
vacuum = true

die-on-term = true
need-app = true
auto-procname = true

max-requests = 3000
max-worker-lifetime = 7200
reload-on-rss = 2048
worker-reload-mercy = 60 

; logto = /home/ubuntu/current/uwsgi_error.log

