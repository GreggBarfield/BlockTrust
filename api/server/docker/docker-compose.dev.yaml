services:
  server:
    environment:
      - PYTHONUNBUFFERED=1
    build:
      context: .
      dockerfile: dockerfile.dev
    volumes:
      - ../../../core:/home/ubuntu/core
      - ../../../api:/home/ubuntu/api
    ports:
      - "5001:80"

networks:
  default:
    name: btn-core_default
    external: true
