version: "3.7"
services:
  mysql:
    image: mysql
    ports:
      - "127.0.0.1:3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ../../local/mysql:/var/lib/mysql
  usdadata:
    build:
      context: .
      dockerfile: dockerfile.dev
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ../../:/home/ubuntu/